# Definition of metadata for experiment. Please do not add ccmm model here,
# add the ccmm_preset instead.
Metadata:
  properties:
    title:
      type: fulltext+keyword
      required: true
      label:
        en: Title
        cs: Název

    description:
      type: fulltext
      label:
        en: Description
      help:
        en: Free-text description of the experiment.

    creators:
      type: RDMCreators
      label:
        en: Creators
        cs: Autoři

    publication_date:
      type: edtf
      label:
        en: Publication date
        cs: Datum publikace

    version:
      type: keyword
      label:
        en: Record Version
        cs: Verze záznamu

    metadata:
      type: object
      properties:
        provenance:
          type: dynamic-object
          label:
            en: Extracted metadata
          help:
            en: Extracted metadata, do not edit manually!
          searchable: false

        simulation_setup:
          type: object
          label:
            en: Simulation Setup
          properties:
            software:
              type: vocabulary
              vocabulary-type: software
              label:
                en: Simulation Software
              help:
                en: Name of the MD engine (e.g., GROMACS, AMBER).

            software_version:
              type: keyword
              label:
                en: Software Version
              help:
                en: Version of the simulation software.

            force_field:
              type: vocabulary
              vocabulary-type: force_field
              label:
                en: Force Field
              help:
                en: >-
                  Name of the force field used
                  (e.g., CHARMM36, AMBER99SB-ILDN).

            water_model:
              type: vocabulary
              vocabulary-type: water_model
              label:
                en: Water Model
              help:
                en: Water model used in the simulation (e.g., TIP3P, SPC/E).

            integrator:
              type: vocabulary
              vocabulary-type: integrator
              label:
                en: Integrator
              help:
                en: Integrator algorithm (e.g., leap-frog, Verlet).

        thermodynamic_state:
          type: object
          label:
            en: Thermodynamic State
          properties:
            ensemble:
              type: vocabulary
              vocabulary-type: ensemble
              label:
                en: Ensemble
              help:
                en: Thermodynamic ensemble used in the simulation.

            reference_temperature:
              type: double
              min_inclusive: 0
              searchable: false
              label:
                en: Reference Temperature (K)
              help:
                en: Reference temperature of the simulation in Kelvin.

            reference_pressure:
              type: double
              min_inclusive: 0
              searchable: false
              label:
                en: Reference Pressure (bar)
              help:
                en: Reference pressure of the simulation (when applicable).

            thermostat:
              type: vocabulary
              vocabulary-type: thermostat
              label:
                en: Thermostat
              help:
                en: >-
                  Temperature coupling algorithm
                  (e.g., V-rescale, Nosé-Hoover).

            barostat:
              type: vocabulary
              vocabulary-type: barostat
              label:
                en: Barostat
              help:
                en: >-
                  Pressure coupling algorithm
                  (e.g., Parrinello-Rahman, Berendsen).

        temporal_extent:
          type: object
          label:
            en: Temporal Extent
          properties:
            simulation_length:
              type: double
              min_exclusive: 0
              searchable: false
              label:
                en: Simulation Length (ns)
              help:
                en: Total simulated time in nanoseconds.

            timestep:
              type: double
              min_exclusive: 0
              searchable: false
              label:
                en: Timestep (fs)
              help:
                en: Integration timestep in femtoseconds.

            number_of_steps:
              type: long
              min_exclusive: 0
              searchable: false
              label:
                en: Number of Steps
              help:
                en: Total number of integration steps.

        system:
          type: object
          label:
            en: System
          properties:
            total_atoms:
              type: long
              min_exclusive: 0
              searchable: false
              label:
                en: Total Atoms
              help:
                en: Total number of atoms in the simulated system.

            box_type:
              type: vocabulary
              vocabulary-type: box_type
              label:
                en: Box Type
              help:
                en: Simulation box geometry (e.g., cubic, dodecahedron, octahedron, triclinic).

            box_dimensions:
              type: array
              min_items: 3
              max_items: 6
              label:
                en: Box Dimensions
              help:
                en: >-
                  Box lengths (a, b, c) and, if applicable,
                  angles (alpha, beta, gamma).
              items:
                # ArrayDataType.get_facet only forwards `label` to the item
                # type, so the flag has to live on the items themselves.
                type: double
                min_exclusive: 0
                searchable: false

RDMCreators:
  label:
    en: Creators
    cs: Autoři
  type: array
  items:
    type: RDMCreator
  ui_marshmallow_field_class: oarepo_rdm.services.schemas.RDMCreatorListUIField
